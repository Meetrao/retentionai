<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" fill="none">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0f172a"/>
      <stop offset="100%" stop-color="#020617"/>
    </linearGradient>
    <linearGradient id="ringGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#38bdf8"/>
      <stop offset="50%" stop-color="#6366f1"/>
      <stop offset="100%" stop-color="#a855f7"/>
    </linearGradient>
    <linearGradient id="pulseGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#38bdf8" stop-opacity="0.2"/>
      <stop offset="50%" stop-color="#818cf8" stop-opacity="0.9"/>
      <stop offset="100%" stop-color="#a855f7" stop-opacity="0.2"/>
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="2.5" result="blur"/>
      <feComposite in="SourceGraphic" in2="blur" operator="over"/>
    </filter>
  </defs>

  <!-- Background Squircle Shield -->
  <rect x="4" y="4" width="56" height="56" rx="16" fill="url(#bgGrad)" stroke="url(#ringGrad)" stroke-width="2.5"/>

  <!-- Retention Neural Cluster -->
  <!-- Connecting Links -->
  <path d="M32 16 L18 44" stroke="#6366f1" stroke-width="2.5" stroke-linecap="round" opacity="0.6"/>
  <path d="M32 16 L46 44" stroke="#6366f1" stroke-width="2.5" stroke-linecap="round" opacity="0.6"/>
  <path d="M18 44 L46 44" stroke="#38bdf8" stroke-width="2.5" stroke-linecap="round" opacity="0.7"/>

  <!-- Dynamic Retention Retention Arc (Heartbeat / Pulse) -->
  <path d="M22 34 Q32 24 42 34" stroke="url(#ringGrad)" stroke-width="3" stroke-linecap="round" fill="none" filter="url(#glow)"/>

  <!-- Retention Core Nodes -->
  <!-- Top Leader Node -->
  <circle cx="32" cy="16" r="5" fill="#38bdf8" filter="url(#glow)"/>
  <circle cx="32" cy="16" r="2.5" fill="#ffffff"/>

  <!-- Left Talent Node -->
  <circle cx="18" cy="44" r="4.5" fill="#818cf8" filter="url(#glow)"/>
  <circle cx="18" cy="44" r="2" fill="#ffffff"/>

  <!-- Right Talent Node -->
  <circle cx="46" cy="44" r="4.5" fill="#a855f7" filter="url(#glow)"/>
  <circle cx="46" cy="44" r="2" fill="#ffffff"/>

  <!-- Center Sparkle / AI Intelligence Node -->
  <circle cx="32" cy="30" r="3" fill="#38bdf8" opacity="0.9"/>
</svg>